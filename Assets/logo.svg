<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A5F58;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A7B70;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#brandGradient)" opacity="0.15"/>
  
  <!-- Book shape -->
  <path d="M18 14 
           L46 14 
           C49.3 14 52 16.7 52 20 
           L52 44 
           C52 47.3 49.3 50 46 50 
           L18 50 
           C14.7 50 12 47.3 12 44 
           L12 20 
           C12 16.7 14.7 14 18 14 Z" 
        fill="none" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Book spine detail -->
  <path d="M18 14 L18 50" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pages lines -->
  <g stroke="url(#brandGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="22" y1="22" x2="42" y2="22"/>
    <line x1="22" y1="30" x2="42" y2="30"/>
    <line x1="22" y1="38" x2="38" y2="38"/>
  </g>
  
  <!-- Spark/play indicator -->
  <g transform="translate(38, 12)">
    <polygon points="0,8 3,0 6,8 0,4 6,4" fill="url(#brandGradient)" opacity="0.9"/>
  </g>
</svg>