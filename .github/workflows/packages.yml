name: NuGet Package

# Builds the .nupkg and publishes it to GitHub Packages so it shows up under
# the repository's Packages page (https://github.com/Joeldev0208?tab=packages).
#
# The package inherits the repository's access; the last step tries to make it
# public when the repo is public. If the repo is private the step is skipped.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PACKAGE_ID: learn-assist
  NUGET_FEED: https://nuget.pkg.github.com/Joeldev0208/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="1.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${v}"

      - name: Pack
        shell: bash
        run: dotnet pack learn-Assist.csproj -c Release \
          -p:Version=${{ steps.version.outputs.version }} -o packages

      - name: Push to GitHub Packages
        shell: bash
        run: dotnet nuget push "packages/*.nupkg" \
          --source "${NUGET_FEED}" \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --skip-duplicate

      - name: Make package public (only works for public repos)
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/user/packages/nuget/${PACKAGE_ID}/visibility" \
            -d '{"visibility":"public"}'
