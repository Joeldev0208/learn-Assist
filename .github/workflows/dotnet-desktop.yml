name: .NET Core Desktop CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    env:
      # Proyecto principal (un solo csproj en la raíz, sin .sln)
      Solution_Name: learn-Assist.csproj
      # Ruta al proyecto de tests
      Test_Project_Path: tests/learn-Assist.Tests/learn-assist.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET SDK
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Build the application
    - name: Build
      run: dotnet build ${{ env.Solution_Name }} -c Release --no-restore

    # Execute unit tests
    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} -c Release --no-restore --verbosity normal
